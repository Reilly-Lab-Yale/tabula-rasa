name: publish scMPRAforge

# Publishes the package to PyPI when a release tag is pushed.
#
# The tag pattern is namespaced because this repository's tags are mostly not
# releases -- they mark synthetic datasets and archived branches
# (10000cell_synthetic, archive/deseq, ...). A bare "v*" trigger would fire on
# unrelated tags.
#
#   git tag scmpraforge-v0.1.0 && git push origin scmpraforge-v0.1.0
#
# Authentication is PyPI Trusted Publishing (OIDC): no API token is stored.
# This requires a one-time setup at pypi.org -> the project -> Publishing,
# naming this repository, this workflow file, and the "pypi" environment.
# For a project that does not exist on PyPI yet, add it as a "pending
# publisher" first; the first successful run creates the project.

on:
  push:
    tags:
      - 'scmpraforge-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A tag that disagrees with __init__.__version__ would publish under a
      # version nobody can trace back to a commit, and PyPI will not let that
      # version be reused. Fail before building.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#scmpraforge-v}"
          pkg_version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('scMPRAforge/__init__.py').read_text()).group(1))")
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $tag_version does not match __version__ $pkg_version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Install the built wheel and import it. This is the check that catches a
  # dependency the package needs but does not declare -- tf-keras was exactly
  # that, and importing scMPRAforge fails without it. Slow (TensorFlow), but a
  # broken wheel on PyPI cannot be replaced, only yanked.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install wheel and import
        run: |
          python -m pip install dist/*.whl
          python -c "import scMPRAforge; print('version', scMPRAforge.__version__)"

  # Only a pushed tag publishes. workflow_dispatch runs build and smoke-test
  # and stops, so the wheel can be exercised without burning a version -- a
  # version, once uploaded to PyPI, can never be reused.
  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
