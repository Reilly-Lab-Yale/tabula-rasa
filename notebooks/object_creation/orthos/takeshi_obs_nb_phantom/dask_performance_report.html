it=\"60GB\")\n    client = Client(cluster)\n    print(f\"Dashboard: {client.dashboard_link}\", flush=True)\n\n    print(\"Loading takeshi data...\", flush=True)\n    takeshi = scm.scMPRA_data.from_parquet(str(DATA_DIR / \"takeshi_scmpra_umiwise.scmpra\"))\n    takeshi.set_negative_controls(NEGATIVE_CONTROLS)\n    takeshi.set_reference_cell(\"HepG2\")\n    takeshi.ortho_filter()\n    print(\"Data loaded and filtered.\", flush=True)\n\n    ortho_obj = scm.ortho()\n\n    report_path = str(SCRIPT_DIR / \"dask_performance_report.html\")\n    t0 = time.time()\n    with performance_report(filename=report_path):\n        print(\"\\nFitting by_cre...\", flush=True)\n        t_cre = time.time()\n        ortho_obj.fit_by_cre_models(client=client, dat=takeshi, nb_only=True)\n        print(f\"by_cre done in {time.time()-t_cre:.1f}s\", flush=True)\n\n        print(\"\\nFitting by_cell_type...\", flush=True)\n        t_ct = time.time()\n        ortho_obj.fit_by_cell_type_models(client=client, dat=takeshi, nb_only=True)\n        print(f\"by_cell_type done in {time.time()-t_ct:.1f}s\", flush=True)\n\n    total_time = time.time() - t0\n    print(f\"\\nTotal fit time: {total_time:.1f}s ({total_time/60:.1f}min)\", flush=True)\n\n    print(\"Extracting parameters...\", flush=True)\n    ortho_obj.extract_params(client)\n\n    print(f\"Saving to {OUT_ROOT / OUT_NAME}...\", flush=True)\n    ortho_obj.save(str(OUT_ROOT), OUT_NAME, client=client)\n    print(\"Saved.\", flush=True)\n\n    client.close()\n    cluster.close()\n\n    print(f\"\\nTotal wall time: {total_time:.1f}s ({total_time/60:.1f}min)\", flush=True)\n    if SLURM_JOB_ID != \"unknown\":\n        sacct_out = subprocess.run(\n            [\"sacct\", \"-j\", SLURM_JOB_ID,\n             \"--format=JobID,State,Elapsed,MaxRSS,AveRSS,AllocCPUS,ReqMem\",\n             \"--parsable2\"],\n            capture_output=True, text=True\n        ).stdout\n        print(f\"\\nsacct:\\n{sacct_out}\", flush=True)\n\n        node = os.environ.get(\"SLURMD_NODENAME\", \"\")\n        if node:\n            info = subprocess.run(\n                [\"scontrol\", \"show\", \"node\", node],\n                capture_output=True, text=True\n            ).stdout\n            for field in [\"NodeName\", \"CPUTot\", \"RealMemory\", \"AvailableFeatures\"]:\n                for tok in info.split():\n                    if tok.startswith(f\"{field}=\"):\n                        print(f\"  {tok}\", flush=True)\n\n    print(\"\\nDone.\", flush=True)\n\n        &lt;/pre&gt;\n        "}}}},{"type":"object","name":"TabPanel","id":"p1473","attributes":{"title":"Task Stream","child":{"type":"object","name":"Figure","id":"p1137","attributes":{"name":"task_stream","sizing_mode":"stretch_both","x_range":{"type":"object","name":"DataRange1d","id":"p1135","attributes":{"range_padding":0}},"y_range":{"type":"object","name":"DataRange1d","id":"p1136","attributes":{"range_padding":0}},"x_scale":{"type":"object","name":"LinearScale","id":"p1147"},"y_scale":{"type":"object","name":"LinearScale","id":"p1148"},"title":{"type":"object","name":"Title","id":"p1140","attributes":{"text":"Task Stream"}},"renderers":[{"type":"object","name":"GlyphRenderer","id":"p1168","attributes":{"data_source":{"type":"object","name":"ColumnDataSource","id":"p1132","attributes":{"selected":{"type":"object","name":"Selection","id":"p1133","attributes":{"indices":[],"line_indices":[]}},"selection_policy":{"type":"object","name":"UnionRenderers","id":"p1134"},"data":{"type":"map","entries":[["start",[1775489291808.5708,1775489291844.881,1775489291845.1736,1775489291883.5798,1775489291883.6367,1775489291884.3313,1775489291884.7915,1775489291885.4285,1775489291886.1228,1775489291886.4722,1775489291887.2302,1775489291887.3342,1775489291887.6733,1775489291888.581,1775489291889.3281,1775489291888.7075,1775489291889.9812,1775489291890.0342,1775489291890.5845,1775489291890.6382,1775489291891.6326,1775489291891.9116,1775489291892.3943,1775489291894.8245,1775489291894.936
